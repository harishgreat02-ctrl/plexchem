name: Build PlexChem TI-84 Plus CE

on:
  push:
  workflow_dispatch:

jobs:
  build-ce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Zumdahl Ch. 12 Unit Tests
        run: make sim

      - name: Install CE C/C++ Toolchain
        run: |
          curl -fSL https://github.com/CE-Programming/toolchain/releases/latest/download/CEdev-Linux.tar.gz -o CEdev.tar.gz
          mkdir -p "$HOME/CEdev"
          tar -xzf CEdev.tar.gz -C "$HOME/CEdev"
          CEDEV_DIR="$(dirname "$(dirname "$(find "$HOME/CEdev" -name makefile.mk | head -n 1)")")"
          echo "$CEDEV_DIR/bin" >> "$GITHUB_PATH"
          echo "CEDEV=$CEDEV_DIR" >> "$GITHUB_ENV"

      - name: Build PLEXCHEM.8xp
        run: make CEDEV="$CEDEV"

      - name: Upload PLEXCHEM.8xp
        uses: actions/upload-artifact@v4
        with:
          name: PlexChem-TI84CE
          path: bin/*.8xp
