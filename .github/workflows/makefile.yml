name: Build PlexChem TI-84 Plus CE Flash App

on:
  push:
  workflow_dispatch:

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Zumdahl Ch. 12 Unit Tests
        run: make sim

      - name: Install CE C/C++ Toolchain
        run: |
          curl -fSL https://github.com/CE-Programming/toolchain/releases/latest/download/CEdev-Linux.tar.gz -o CEdev.tar.gz
          mkdir -p "$HOME/CEdev"
          tar -xzf CEdev.tar.gz -C "$HOME/CEdev"
          CEDEV_DIR="$(dirname "$(dirname "$(find "$HOME/CEdev" -name makefile.mk | head -n 1)")")"
          echo "$CEDEV_DIR/bin" >> "$GITHUB_PATH"
          echo "CEDEV=$CEDEV_DIR" >> "$GITHUB_ENV"

      - name: Build PLEXCHEM Flash App (.8ek) & Split AppVars
        run: |
          make CEDEV="$CEDEV" APPLICATION=YES
          mkdir -p release
          convbin --iformat 8ek --input bin/PLEXCHEM.8ek --oformat 8xv-split --maxvarsize 65200 --output release/APP.8xv --name APP

      - name: Build CHMSETUP Installer via CE-Programming/app_tools
        run: |
          git clone --depth 1 https://github.com/CE-Programming/app_tools.git /tmp/app_tools
          make -C /tmp/app_tools/installer CEDEV="$CEDEV" NAME=CHMSETUP
          cp /tmp/app_tools/installer/bin/*.8xp release/

      - name: Upload Flash App Installer Files
        uses: actions/upload-artifact@v4
        with:
          name: PlexChem-APPS-Installer
          path: release/*
